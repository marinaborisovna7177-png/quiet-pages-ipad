name: Studio 6 — build and test
on:
  workflow_dispatch:
  push:
    branches: [main, studio6]
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare offline assets and validate sources
        run: |
          python -m pip install Pillow==11.3.0 tree-sitter==0.25.2 tree-sitter-swift==0.7.4 pbxproj==4.3.3
          python scripts/prepare_studio_assets.py
          python scripts/check_source.py
          xcodebuild -version
          xcrun swiftc -frontend -parse Sources/*.swift Tests/*.swift
      - name: Select available iPad simulator
        run: |
          xcrun simctl list devices available --json > devices.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          devices=json.load(open('devices.json'))['devices']
          matches=[(runtime,d) for runtime,ds in devices.items() for d in ds if 'iPad' in d['name'] and d.get('isAvailable')]
          if not matches: raise SystemExit('No iPad simulator available')
          runtime,d=sorted(matches,key=lambda pair: pair[0])[-1]
          print('SIMULATOR_ID='+d['udid'])
          print('SIMULATOR_RUNTIME='+runtime)
          PY
      - name: Build and run storage, migration and asset tests
        run: |
          set -o pipefail
          xcodebuild test -project QuietPages.xcodeproj -scheme QuietPages \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
      - name: Build device application
        run: |
          set -o pipefail
          xcodebuild build -project QuietPages.xcodeproj -scheme QuietPages \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
      - name: Package unsigned IPA after successful checks
        run: |
          test -d build/Build/Products/Release-iphoneos/QuietPages.app
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/QuietPages.app ipa/Payload/
          cd ipa
          zip -q -r QuietPages-Studio6-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QuietPages-Studio6-IPA
          path: ipa/QuietPages-Studio6-unsigned.ipa
          if-no-files-found: error
      - name: Save logs and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuietPages-Studio6-Checks
          path: |
            *.log
            TestResults.xcresult
            Docs/LOCAL_CHECKS.json
            devices.json
      - name: Explain test scope
        if: always()
        run: |
          echo "Simulator runtime: $SIMULATOR_RUNTIME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical iPad 6, Apple Pencil, touch routing and memory-pressure acceptance require device testing. Build success does not certify them.' >> "$GITHUB_STEP_SUMMARY"
