name: Собрать приложение для iPad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Скачать исходный проект
        uses: actions/checkout@v4
      - name: Выбрать Xcode
        run: xcodebuild -version
      - name: Проверить состав исходников до компиляции
        shell: bash
        run: |
          set -euo pipefail
          test -f Sources/PageNavigator.swift
          test -f Sources/PaperCatalog.swift
          test -f Sources/CoverCatalog.swift
          for source in Sources/*.swift; do
            base=$(basename "$source")
            if ! grep -Fq "$base in Sources" QuietPages.xcodeproj/project.pbxproj; then
              echo "::error::Файл $base не добавлен в Xcode target"
              exit 1
            fi
          done
          echo "Все Swift-файлы включены в Xcode-проект."
      - name: Распаковать 2000 стикеров для офлайн-приложения
        shell: bash
        run: |
          set -euo pipefail
          for pack in StickerPacks/MegaStickers_*.zip; do
            unzip -qo "$pack" -d Resources/Assets.xcassets
          done
          echo "Imported sticker imagesets: $(find Resources/Assets.xcassets -name 'Sticker_Mega_*.imageset' -type d | wc -l)"
          test "$(find Resources/Assets.xcassets -name 'Sticker_Mega_*.imageset' -type d | wc -l)" -eq 2000
      - name: Собрать iPadOS приложение без подписи
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuietPages.xcodeproj \
            -scheme QuietPages \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Упаковать в IPA для переподписи через Sideloadly
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuietPages.app Payload/
          zip -qry QuietPages-unsigned.ipa Payload
      - name: Сохранить IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuietPages-IPA
          path: QuietPages-unsigned.ipa
          retention-days: 14
