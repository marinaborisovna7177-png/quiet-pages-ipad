name: Собрать приложение для iPad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Скачать исходный проект
        uses: actions/checkout@v4
      - name: Выбрать Xcode
        run: xcodebuild -version
      - name: Собрать iPadOS приложение без подписи
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuietPages.xcodeproj \
            -scheme QuietPages \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Упаковать в IPA для переподписи через Sideloadly
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuietPages.app Payload/
          zip -qry QuietPages-unsigned.ipa Payload
      - name: Сохранить IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuietPages-IPA
          path: QuietPages-unsigned.ipa
          retention-days: 14
